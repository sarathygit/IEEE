# Every externalised value keeps its original local default, so an
# un-configured `mvn spring-boot:run` behaves exactly as before.
#   PORT                  platform-assigned HTTP port (Render injects this)
#   ML_BASE_URL           origin of the FastAPI scoring core
#   ML_CONNECT_TIMEOUT_MS / ML_READ_TIMEOUT_MS
#                         raise these on platforms that cold-start the
#                         scorer; the tight local defaults are the values
#                         the reported latency figures were measured with
#   CORS_ALLOWED_ORIGINS  comma-separated; one wildcard label allowed
#   H2_CONSOLE            disable on any publicly reachable deployment
server:
  # 8081 locally: Docker Desktop occupies 8080 on this machine.
  port: ${PORT:8081}

spring:
  application:
    name: finguard-switch
  datasource:
    url: jdbc:h2:mem:finguard;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: ${H2_CONSOLE:true}
      path: /h2-console

finguard:
  demo:
    # Extra synthetic accounts for the concurrency benchmark (0 = demo only).
    load-pool-size: ${LOAD_POOL_SIZE:0}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  ml:
    # Python Predictive Intelligence Core (FastAPI). Port 8001 locally because
    # 8000 is occupied by Docker Desktop on this machine.
    base-url: ${ML_BASE_URL:http://127.0.0.1:8001}
    connect-timeout-ms: ${ML_CONNECT_TIMEOUT_MS:300}
    read-timeout-ms: ${ML_READ_TIMEOUT_MS:1500}

logging:
  level:
    com.finguard: INFO
