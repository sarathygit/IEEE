# Port 8081 locally: Docker Desktop occupies 8080 on this machine.
server:
  port: 8081

spring:
  application:
    name: finguard-switch
  datasource:
    url: jdbc:h2:mem:finguard;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

finguard:
  demo:
    # Extra synthetic accounts for the concurrency benchmark (0 = demo only).
    load-pool-size: ${LOAD_POOL_SIZE:0}
  ml:
    # Python Predictive Intelligence Core (FastAPI). Port 8001 locally because
    # 8000 is occupied by Docker Desktop on this machine.
    base-url: http://127.0.0.1:8001
    connect-timeout-ms: 300
    read-timeout-ms: 1500

logging:
  level:
    com.finguard: INFO
